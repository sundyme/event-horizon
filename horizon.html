<title>视界 Event Horizon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Noto+Serif+SC:wght@200;300;500&family=Noto+Sans+SC:wght@700;900&family=Montserrat:wght@700;900&display=swap">
<style>
:root{
  color-scheme: dark;
  --void:#040407;
  --ink:#ece6da;
  --dim:#8d8a96;
  --faint:rgba(236,230,218,.16);
  --ember:#ffb36b;
  --plasma:#a9beff;
  --serif:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--serif);-webkit-font-smoothing:antialiased;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:var(--void)}
#frame{position:relative;overflow:hidden;background:#000}
#gl,#ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{pointer-events:none}
#frame.drag{cursor:grab}
#frame.drag:active{cursor:grabbing}

#intro{position:fixed;inset:0;display:flex;align-items:flex-end;padding:0 max(16px,6vw) calc(max(28px,9vh) + env(safe-area-inset-bottom,0px));
  background:linear-gradient(90deg,rgba(4,4,7,.82) 0%,rgba(4,4,7,.45) 38%,rgba(4,4,7,0) 70%);transition:opacity 1.4s ease}
#intro.gone{opacity:0;pointer-events:none}
.card{max-width:34rem;display:grid;gap:1.1rem}
.eyebrow{margin:0;font:400 .72rem/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--dim)}
h1{margin:0;display:grid;gap:.5rem;font-weight:200}
h1 .zh{font:200 clamp(4.2rem,11vw,8.5rem)/.9 var(--serif);letter-spacing:.08em;margin-left:-.06em}
h1 .en{font:300 clamp(.8rem,1.6vw,1rem)/1 var(--mono);letter-spacing:.62em;color:var(--ember)}
.lede{margin:0;font:300 1.02rem/1.85 var(--serif);color:rgba(236,230,218,.82);max-width:30em;text-wrap:pretty}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.9rem 1.4rem;margin-top:.4rem}
#go{appearance:none;border:1px solid rgba(255,179,107,.55);background:rgba(255,179,107,.08);color:var(--ink);
  font:400 .95rem/1 var(--serif);letter-spacing:.3em;padding:1rem 1.5rem 1rem 1.7rem;cursor:pointer;display:inline-flex;gap:1rem;align-items:center;transition:background .3s,border-color .3s}
#go:hover:not(:disabled){background:rgba(255,179,107,.18);border-color:var(--ember)}
#go:focus-visible,.ctl button:focus-visible{outline:2px solid var(--plasma);outline-offset:3px}
#go:disabled{opacity:.55;cursor:progress}
#go .arrow{font-family:var(--mono);letter-spacing:0;color:var(--ember)}
.hint{font:400 .72rem/1.6 var(--mono);letter-spacing:.08em;color:var(--dim)}
.hint.film{color:var(--ember);text-decoration:none;border-bottom:1px solid rgba(255,179,107,.4);padding-bottom:2px}
.hint.film:hover{border-bottom-color:var(--ember)}
.hint.film:focus-visible{outline:2px solid var(--plasma);outline-offset:3px}
.specs{margin:0;font:300 .7rem/1.7 var(--mono);letter-spacing:.06em;color:rgba(141,138,150,.85);border-top:1px solid var(--faint);padding-top:.9rem}
.specs b{font-weight:400;color:var(--ink)}

.ctl{position:fixed;right:max(16px,2.2vw);bottom:calc(max(14px,2.2vh) + env(safe-area-inset-bottom,0px));display:flex;gap:.35rem;transition:opacity .6s ease}
.ctl.idle{opacity:0;pointer-events:none}
.ctl button{appearance:none;background:rgba(4,4,7,.55);border:1px solid var(--faint);color:var(--ink);font:400 .74rem/1 var(--serif);letter-spacing:.14em;
  padding:.62rem .8rem;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ctl button:hover{border-color:rgba(236,230,218,.5)}
.ctl button[aria-pressed="true"]{color:var(--ember);border-color:rgba(255,179,107,.5)}
#err{position:fixed;inset:auto 16px 16px 16px;font:400 .8rem/1.6 var(--mono);color:#ffb3a0;white-space:pre-wrap}
@media (max-width:640px){
  #intro{background:linear-gradient(0deg,rgba(4,4,7,.9) 0%,rgba(4,4,7,.55) 45%,rgba(4,4,7,0) 80%);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .lede{font-size:.92rem}
  .ctl button{padding:.55rem .6rem;letter-spacing:.06em}
}
@media (prefers-reduced-motion:reduce){#intro,.ctl{transition:none}}
</style>

<div id="stage"><div id="frame"><canvas id="gl"></canvas><canvas id="ov"></canvas></div></div>

<div id="intro">
  <div class="card">
    <p class="eyebrow">实时光线追踪 · 72 秒</p>
    <h1><span class="zh">视界</span><span class="en">EVENT HORIZON</span></h1>
    <p class="lede">从星空深处出发，坠向一个黑洞。画面里的每一束光，都沿着弯曲时空中的真实路径逐像素追踪；声音与画面同步生成。</p>
    <div class="row">
      <button id="go" type="button" disabled>正在生成星空<span class="arrow">…</span></button>
      <span class="hint">建议戴耳机 · 全屏观看</span>
      <a class="hint film" id="filmLink" href="film.html" hidden>观看成片 →</a>
    </div>
    <p class="specs">史瓦西半径 <b>r<sub>s</sub></b> = 1 · 光子球 <b>1.5 r<sub>s</sub></b> · 最内稳定轨道 <b>3 r<sub>s</sub></b><br>相对论多普勒增亮 · 引力红移 · 黑体辐射色温</p>
  </div>
</div>

<div class="ctl idle" id="ctl">
  <button id="bSound" type="button" aria-pressed="false">静音</button>
  <button id="bFree" type="button">自由视角</button>
  <button id="bReplay" type="button">重播</button>
  <button id="bFull" type="button">全屏</button>
</div>
<div id="err" hidden></div>

<script>
(() => {
'use strict';
const Q = new URLSearchParams(location.search);
if (window.HORIZON_SITE) { const fl = document.getElementById('filmLink'); if (fl) fl.hidden = false; }
const FILM = Q.has('film');
const DEBUG = Q.has('debug');
const FW = +(Q.get('w') || 1920), FH = +(Q.get('h') || 804);
const ASPECT = 2.39;
const DUR = 72.0, T_IGN = 13.5, T_JET = 27.0, T_CUT = 60.3, T_TITLE = 62.0;
const D2R = Math.PI / 180;
const TPEAK = +(Q.get('tp') ?? 3500);
const TM = +(Q.get('tm') ?? 1), TMSAT = +(Q.get('sat') ?? (TM ? 1.12 : 1.2));
const $ = s => document.querySelector(s);
const cv = $('#gl'), ov = $('#ov'), frameEl = $('#frame');

function fail(msg) { const e = $('#err'); e.hidden = false; e.textContent = msg; document.title = FILM ? 'ERROR' : document.title; console.error(msg); }

const gl = cv.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, preserveDrawingBuffer: FILM, powerPreference: 'high-performance' });
if (!gl) { fail('这个浏览器不支持 WebGL2，无法运行实时光线追踪。请换用最新版 Chrome、Edge、Safari 或 Firefox。'); return; }
const hasCBF = !!gl.getExtension('EXT_color_buffer_float');
if (!hasCBF) gl.getExtension('EXT_color_buffer_half_float');
gl.getExtension('OES_texture_float_linear');
const PAR = gl.getExtension('KHR_parallel_shader_compile');

// ───────────────────────────── GLSL ─────────────────────────────
const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler3D; precision highp samplerCube;
`;
const VS = `#version 300 es
out vec2 vUv;
void main(){ vec2 p = vec2(float((gl_VertexID<<1)&2), float(gl_VertexID&2)); vUv = p; gl_Position = vec4(p*2.0-1.0, 0.0, 1.0); }`;

const NOISE_LIB = `
uvec3 pcg3d(uvec3 v){ v = v*1664525u + 1013904223u; v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; v ^= v >> 16u; v.x += v.y*v.z; v.y += v.z*v.x; v.z += v.x*v.y; return v; }
vec3 grd(ivec3 p, int per, uint seed){ p = ((p % per) + per) % per; uvec3 h = pcg3d(uvec3(p) + uvec3(seed*1013u, seed*7919u, seed*104729u)); return vec3(h & 0xFFFFu)/32767.5 - 1.0; }
float gnoise(vec3 x, int per, uint seed){
  ivec3 i = ivec3(floor(x)); vec3 f = fract(x); vec3 u = f*f*f*(f*(f*6.0-15.0)+10.0);
  float a = dot(grd(i, per, seed), f);
  float b = dot(grd(i+ivec3(1,0,0), per, seed), f-vec3(1,0,0));
  float c = dot(grd(i+ivec3(0,1,0), per, seed), f-vec3(0,1,0));
  float d = dot(grd(i+ivec3(1,1,0), per, seed), f-vec3(1,1,0));
  float e = dot(grd(i+ivec3(0,0,1), per, seed), f-vec3(0,0,1));
  float g = dot(grd(i+ivec3(1,0,1), per, seed), f-vec3(1,0,1));
  float h = dot(grd(i+ivec3(0,1,1), per, seed), f-vec3(0,1,1));
  float k = dot(grd(i+ivec3(1,1,1), per, seed), f-vec3(1,1,1));
  return mix(mix(mix(a,b,u.x), mix(c,d,u.x), u.y), mix(mix(e,g,u.x), mix(h,k,u.x), u.y), u.z);
}
`;

// periodic 3D noise volume (tiles with period 1 in every axis)
const NOISE_FS = HDR + NOISE_LIB + `
uniform float uZ; uniform float uSize; out vec4 o;
float fbmP(vec3 p, int per, uint seed, int oct){ float s = 0.0, a = 0.5, n = 0.0; int pp = per; vec3 q = p*float(per);
  for (int k = 0; k < 7; k++){ if (k >= oct) break; s += a*gnoise(q, pp, seed + uint(k)*31u); n += a; a *= 0.5; q *= 2.0; pp *= 2; } return s/n; }
float worley(vec3 p, int per, uint seed){ vec3 q = p*float(per); ivec3 i = ivec3(floor(q)); vec3 f = fract(q); float d = 9.0;
  for (int z=-1; z<=1; z++) for (int y=-1; y<=1; y++) for (int x=-1; x<=1; x++){
    ivec3 c = i + ivec3(x,y,z); ivec3 cw = ((c % per) + per) % per;
    vec3 h = vec3(pcg3d(uvec3(cw) + uvec3(seed*97u, seed*57u, seed*31u)) & 0xFFFFu)/65535.0;
    vec3 r = vec3(float(x),float(y),float(z)) + h - f; d = min(d, dot(r,r)); }
  return sqrt(d); }
void main(){
  vec3 p = vec3(gl_FragCoord.xy/uSize, uZ);
  float n1 = fbmP(p, 4, 1u, 6);
  float n2 = fbmP(p, 8, 11u, 5);
  float w = worley(p, 6, 3u)*0.7 + worley(p, 12, 5u)*0.3;
  float r = 1.0 - abs(fbmP(p, 8, 21u, 5))*1.7;
  o = vec4(clamp(0.5 + n1*1.15, 0.0, 1.0), clamp(0.5 + n2*1.15, 0.0, 1.0), clamp(1.15 - w*1.1, 0.0, 1.0), clamp(r*r, 0.0, 1.0));
}`;

const CUBE_LIB = `
vec3 faceDir(int f, vec2 st){
  if (f==0) return vec3(1.0, -st.y, -st.x);
  if (f==1) return vec3(-1.0, -st.y, st.x);
  if (f==2) return vec3(st.x, 1.0, st.y);
  if (f==3) return vec3(st.x, -1.0, -st.y);
  if (f==4) return vec3(st.x, -st.y, 1.0);
  return vec3(-st.x, -st.y, -1.0);
}`;

// diffuse sky: galactic band, dust lanes, emission nebulae. alpha = star density
const SKY_FS = HDR + NOISE_LIB + CUBE_LIB + `
uniform int uFace; uniform float uSize; out vec4 o;
float fb(vec3 p, int oct){ float s = 0.0, a = 0.5; for (int k=0; k<8; k++){ if (k>=oct) break; s += a*gnoise(p, 4096, 7u + uint(k)); p = p*2.03 + vec3(1.7, 9.2, 3.1); a *= 0.5; } return s; }
void main(){
  vec2 st = gl_FragCoord.xy/uSize*2.0 - 1.0;
  vec3 d = normalize(faceDir(uFace, st));
  vec3 N = normalize(vec3(0.30, 0.91, -0.28));
  vec3 C = normalize(cross(N, vec3(0.1, 0.15, 1.0)));
  vec3 E = cross(N, C);
  float b = asin(clamp(dot(d, N), -1.0, 1.0));
  float l = atan(dot(d, E), dot(d, C));
  float w1 = fb(d*3.0, 5), w2 = fb(d*7.0 + 11.0, 6), w3 = fb(d*19.0 + 5.0, 5);
  float thick = 0.085 + 0.04*w1 + 0.06*exp(-l*l*2.5);
  float bb = b + 0.05*w1;
  float band = exp(-pow(bb/thick, 2.0));
  float core = exp(-(l*l)/0.3 - (b*b)/0.02);
  float clouds = pow(max(0.5 + w2 + 0.5*w3, 0.0), 2.2);
  float field = band*(0.25 + 1.1*clouds) + core*1.6*(0.6 + 0.8*clouds);
  float fil = 1.0 - abs(w2*1.6 + w3*0.8);
  float lane = pow(clamp(fil, 0.0, 1.0), 5.0)*1.4 + smoothstep(0.05, 0.4, w3 + 0.4*w1)*0.5;
  float dust = clamp(lane*exp(-pow((b - 0.025*w1)/(0.05 + 0.02*w1), 2.0)), 0.0, 0.96);
  vec3 col = vec3(0.60, 0.57, 0.52)*field*0.04 + vec3(1.0, 0.76, 0.48)*core*0.09;
  col *= 1.0 - dust;
  float neb = smoothstep(0.12, 0.62, fb(d*2.1 + 31.0, 6));
  vec3 nc = mix(vec3(1.0, 0.26, 0.36), vec3(0.16, 0.70, 0.80), smoothstep(-0.2, 0.3, fb(d*5.0 + 3.0, 4)));
  col += nc*neb*(0.25 + band)*pow(max(w3 + 0.55, 0.0), 2.2)*0.05;
  col += vec3(0.0022, 0.0027, 0.0045);
  o = vec4(col, 0.18 + 1.6*field*(1.0 - dust*0.9));
}`;

// ── main geodesic ray tracer ──
const TRACE_FS = HDR + CUBE_LIB + `
uniform vec2 uRes, uJit, uTan;
uniform vec3 uCamPos, uGalDir, uWP;
uniform mat3 uCamM;
uniform float uRot, uClock, uDisk, uDiskBase, uHeatR, uHeatFlash, uJet, uJetFront, uDop, uSky, uStars, uGal, uStep, uFrame, uRFar, uCamG, uW, uPix;
uniform int uMaxSteps;
uniform vec4 uSpot;
uniform samplerCube uNeb; uniform sampler3D uNoise;
out vec4 o;
const float PI = 3.14159265, TAU = 6.2831853;
uniform float uTPeak;
const float R_OUT = 17.0, KAPPA = 3.2, EMIT = 9.0, ROT_K = 5.0;

float diskH(float r){ return 0.028 + 0.017*r; }
float jetW(float ay){ return 0.24 + 0.1*ay; }
float omegaK(float r){ return ROT_K*0.70710678/(r*sqrt(r)); }
vec3 bb(float T){
  vec3 lam = vec3(0.610, 0.550, 0.465);
  vec3 e = 14388.0/(lam*max(T, 400.0));
  vec3 b = 1.0/(lam*lam*lam*lam*lam*(exp(min(e, 80.0)) - 1.0));
  b /= uWP;
  return b/max(dot(b, vec3(0.2126, 0.7152, 0.0722)), 1e-12);
}
float tprof(float r){ float x = 3.0/max(r, 3.0); return pow(x, 0.75)*pow(max(1.0 - 0.92*sqrt(x), 1e-3), 0.25)/0.545; }

uvec4 pcg4d(uvec4 v){ v = v*1664525u + 1013904223u; v.x += v.y*v.w; v.y += v.z*v.x; v.z += v.x*v.y; v.w += v.y*v.z; v ^= v >> 16u; v.x += v.y*v.w; v.y += v.z*v.x; v.z += v.x*v.y; v.w += v.y*v.z; return v; }
float ign(vec2 p){ return fract(52.9829189*fract(dot(p, vec2(0.06711056, 0.00583715)))); }

float diskField(float ph, float lr, float z, float cyc, float lod){
  float a = ph*(1.0/TAU);
  vec4 A = textureLod(uNoise, vec3(a*2.0, lr*2.6 + cyc*0.431, z*0.05 + cyc*0.173), lod);
  vec4 B = textureLod(uNoise, vec3(a*6.0 + A.r*0.04, lr*9.0 + A.g*0.12, z*0.16 + 0.37), lod + 1.8);
  vec4 C = textureLod(uNoise, vec3(a*19.0 + B.g*0.015, lr*31.0 + B.r*0.1, z*0.4 + 0.61), lod + 3.6);
  return A.r*0.50 + B.g*0.32 + C.a*0.24 + (A.b - 0.5)*0.14;
}

void disk(vec3 p, float r, vec3 vd, float ds, float pw, inout vec3 acc, inout float T){
  float hd = diskH(r);
  float z = p.y/hd;
  if (abs(z) > 3.2 || r > R_OUT || r < 1.6) return;
  float ph = atan(p.z, p.x);
  float lr = log(r);
  float om = omegaK(r);
  const float P = 18.0;
  float ca = uRot/P, fa = fract(ca), cyA = floor(ca);
  float cb = ca + 0.5, fb = fract(cb), cyB = floor(cb) + 17.0;
  float wa = 1.0 - abs(2.0*fa - 1.0);
  float lod = log2(max(pw*333.0/r, 1e-4));
  float nA = diskField(ph - om*fa*P, lr, z, cyA, lod);
  float nB = diskField(ph - om*fb*P, lr, z, cyB, lod);
  float n = mix(nB, nA, wa);
  n = 0.5 + (n - 0.5)*inversesqrt(wa*wa + (1.0 - wa)*(1.0 - wa));
  float c = smoothstep(0.45, 0.82, n);
  float vert = exp(-0.5*z*z*(2.0 - 0.9*c));
  float radial = smoothstep(1.8, 3.0, r)*(1.0 - smoothstep(R_OUT*0.45, R_OUT, r));
  float plunge = mix(0.15, 1.0, smoothstep(2.3, 3.1, r));
  float rings = (0.55 + 0.45*sin(lr*46.0 + n*6.0))*(0.72 + 0.28*cos(2.0*(ph - uRot*0.05) + 7.0*lr + n*2.0));
  float dens = radial*vert*plunge*(0.015 + 2.2*c*c)*rings;
  float spotE = 0.0;
  if (uSpot.x > 0.0){
    float phs = uSpot.z + omegaK(uSpot.y)*uRot;
    vec3 sp = vec3(cos(phs), 0.0, sin(phs))*uSpot.y;
    vec3 tg = vec3(-sin(phs), 0.0, cos(phs));
    vec3 dd = p - sp; float al = dot(dd, tg); vec3 pp = dd - tg*al;
    spotE = uSpot.x*exp(-(dot(pp, pp) + al*al/9.0)/(uSpot.w*uSpot.w));
    dens += spotE*0.5;
  }
  if (dens < 2e-4) return;
  float heat = mix(uDiskBase, 1.0, smoothstep(uHeatR + 1.2, uHeatR - 0.6, r)) + uHeatFlash*exp(-pow((r - uHeatR)/0.9, 2.0));
  float tn = tprof(r)*(0.78 + 0.44*n);
  float beta = min(sqrt(0.5/max(r - 1.0, 0.2)), 0.8);
  vec3 vel = vec3(-p.z, 0.0, p.x)/max(length(p.xz), 1e-3);
  float gD = sqrt(1.0 - beta*beta)/(1.0 - beta*dot(vel, -vd));
  float gG = sqrt(max(1.0 - 1.0/r, 0.01));
  float g = pow(gD*gG, uDop)*uCamG;
  float g4 = g*g*g*g;
  float tn4 = tn*tn; tn4 *= tn4*tn;
  float I = (tn4*heat*EMIT*(0.35 + 1.3*c) + spotE*10.0)*g4*uDisk;
  vec3 S = bb(uTPeak*tn*g*(1.0 + 0.35*spotE))*I;
  float k = dens*KAPPA*(1.0 + 1.5*smoothstep(7.0, 14.0, r));
  float att = exp(-k*ds);
  acc += T*S*(1.0 - att);
  T *= att;
}

void jets(vec3 p, vec3 vd, float ds, inout vec3 acc, inout float T){
  float ay = abs(p.y);
  float w = jetW(ay);
  float rc = length(p.xz);
  if (ay < 1.0 || rc > 2.6*w || ay > uJetFront + 3.0) return;
  float sy = sign(p.y);
  float s = ay - uClock*9.0;
  float ang = atan(p.z, p.x) - ay*0.12*sy;
  float q = rc/w;
  vec4 A = textureLod(uNoise, vec3(ang*(2.0/TAU), s*0.018, q*0.2 + (sy > 0.0 ? 0.0 : 0.5)), 0.0);
  vec4 B = textureLod(uNoise, vec3(ang*(5.0/TAU) + A.r*0.1, s*0.061, q*0.5 + 0.25), 0.0);
  float prof = exp(-q*q*2.6) + 0.55*exp(-pow((q - 0.78)/0.2, 2.0));
  float along = smoothstep(1.0, 4.5, ay)/(1.0 + ay*0.055);
  float knots = pow(A.r, 3.0)*3.2 + B.g*0.45 + pow(B.b, 4.0)*1.5;
  float front = smoothstep(uJetFront + 3.0, uJetFront - 5.0, ay);
  float dj = prof*along*knots*front*uJet;
  if (dj < 1e-4) return;
  const float JB = 0.62, JG = 1.2745;
  float D = pow(1.0/(JG*(1.0 - JB*dot(vec3(0.0, sy, 0.0), -vd))), uDop);
  vec3 jc = mix(vec3(0.34, 0.5, 1.0), vec3(0.95, 0.93, 1.0), smoothstep(0.6, 2.2, knots))*uCamG;
  acc += T*jc*dj*pow(D, 2.6)*2.6*ds;
  T *= exp(-dj*0.015*ds);
}

float stepLen(vec3 p, float r){
  float ds = 0.055*r*clamp(r*0.5, 1.0, 3.0);
  if (r < R_OUT*1.05 && r > 1.5){

// ───────────────────────────── app state & loop ─────────────────────────────
